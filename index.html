<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QVAC Study Buddy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 20px 0;
    }

    #answer {
      background: white;
      padding: 20px;
      min-height: 150px;
      margin-top: 20px;
      white-space: pre-wrap;
      border-radius: 8px;
    }

    .local {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>🧠 QVAC Study Buddy</h1>

  <p>
    Ask a question and get an AI answer generated locally.
  </p>

  <textarea
    id="question"
    placeholder="Example: Explain gravity like I'm 12."
  ></textarea>

  <button id="ask">
    Ask QVAC
  </button>

  <div id="status">
    Ready.
  </div>

  <div id="answer"></div>

  <div class="local">
    🔒 AI inference runs locally on this device using QVAC.
  </div>

  <script src="renderer.js"></script>

</body>
</html>
